[workspace]
members = ["crates/city_core", "crates/city_bevy"]
default-members = ["crates/city_bevy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 2
