name: House gallery

on:
  pull_request:
    paths:
      - 'house-gallery/**'
      - '.github/workflows/house-gallery.yml'
  push:
    branches: [main]
    paths:
      - 'house-gallery/**'
      - '.github/workflows/house-gallery.yml'

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: house-gallery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: house-gallery/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
