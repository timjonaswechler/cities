name: Road editor

on:
  pull_request:
    paths:
      - 'road-editor/**'
      - '.github/workflows/road-editor.yml'
  push:
    branches: [main]
    paths:
      - 'road-editor/**'
      - '.github/workflows/road-editor.yml'

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: road-editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: road-editor/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: road-editor-browser-evidence
          path: |
            road-editor/evidence/*.png
            road-editor/test-results/
